[project]
name = "saku"
version = "0.1.0"
description = "Archiveur open source : compression par type de fichier, puis chiffrement authentifié"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = ["cryptography>=46,<47"]

[project.scripts]
saku = "saku.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/saku"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # typographie française dans les textes

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S108", "S311", "S603"]  # essais : aléa non cryptographique voulu
"bench/*" = ["S603", "S607"]
"outils/*" = ["S310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
